[project]
name = "fridge"
version = "0.1.0"
authors = [
    { name = "Ulrik Södergren", email = "ulrik@oddtech.se" }
]
requires-python = ">=3.13"
description = "Game fridge controller. Controlles cooler, heater and ventilation based on temperature and humidity"
dependencies = [
    "gpiozero==2.0.1",
    "paho-mqtt == 1.6.1",
    "smbus2>=0.6",
    "diskcache>=5.6",
    "click>=8.3.3",
]

[project.scripts]
fridge = "fridge:cli"

[dependency-groups]
test = [
    "pytest > 8.3",
    "pytest-asyncio > 0.24",
    "pytest-timeout > 2.3",
    "pytest-mock>=3.14.0",
    "asyncmock",
    "freezegun > 1.5",
    "coverage > 7.0"
]
dev = [
    "sphinx",
    "myst-parser",
    "sphinx-autodoc2",
    "furo",
    "pre-commit>=4.5.1",
    "pip-audit>=2.10.0",
    "requests",
    "ruff",
    "typer"
]

[tool.pytest.ini_options]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_level = "INFO"
log_cli=true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"
line-length = 100

[tool.ruff.lint.pycodestyle]
max-line-length = 110

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "FA",  # flake8-future-annotations
    "N",  # pep8-naming
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
ignore = [
    "N818",  # keep the exceptions names to not break dependent code
]


[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"
