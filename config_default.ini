[General]
# Sensor reading and regulation loop time in seconds
refresh_rate = 30
# Minimum interval in seconds between relay state changes (per relay)
min_relay_interval = 300

[Hardware]
# I2C address for the internal SHT30 sensor
sht30_internal_address = 0x44
# I2C address for the external SHT30 sensor (optional)
sht30_external_address = 0x45
# I2C address for the MCP23017 GPIO expander
mcp23017_address = 0x20
# GPIO pin on Raspberry Pi used for interrupts from MCP23017 Port A
interrupt_gpio = 27

[CoolDownMode]
# Target temperature in degrees Celsius
target_temperature = 12.0
# Hysteresis for temperature regulation in degrees Celsius
hysteresis = 1.5
# Duration in hours before automatically switching to Cool mode
auto_switch_hours = 10

[CoolMode]
# Target temperature in degrees Celsius
target_temperature = 5.0
# Hysteresis for temperature regulation in degrees Celsius
hysteresis = 1.5
# The temperature is not allowed to get bellow this point, independent of energy state
freeze_guard = 0.0
# Humidity threshold for the ventilation fan
target_humidity = 55.0
# Humidity hysteresis
humidity_hysteresis = 5.0

[Energy]
# Temperature adjustments during different price states
# Low price: lower target for cooling, raise for heating
low_price_cool_adj = -2.0
low_price_heat_adj = 1.0
# High price: raise target for cooling, lower for heating
high_price_cool_adj = 2.0
high_price_heat_adj = -2.0

[Logging]
# Log file for events
log_file = ~/fridge.log
# Database for temperature, humidity and states
database_file = ~/fridge.db

[MQTT]
# MQTT broker hostname or IP. Set to an unreachable host to disable MQTT.
mqtt_broker = localhost
# MQTT broker TCP port
mqtt_port = 1883
# Prefix prepended to all published and subscribed topics
mqtt_topic_prefix = fridge/
# MQTT username (the broker uses username-only authentication)
user = fridge
# Optional password; leave empty for username-only authentication
# password =
# Interval in seconds for publishing measurements and current targets
update_interval = 60

[Tibber]
api_key = tibber_api_key
# Optional Tibber home id. Leave empty to use the first home on the account.
# home_id =
# SQLite database for energy prices and computed energy states
database_file = ~/fridge_data/fridge_prices.db
# Local hour (0-23) at which the next day's prices are fetched
fetch_hour = 16
# IANA timezone used for scheduling the daily fetch
timezone = Europe/Stockholm
# Energy-price classification (pre-cooling planner)
# Number of 15-minute slots to look back and pre-cool before an expensive
# (HIGH) period (12 = 3 hours)
precool_lookahead_slots = 12
# Maximum number of consecutive LOW slots to avoid over-cooling (4 = 1 hour)
max_consecutive_low_slots = 4
